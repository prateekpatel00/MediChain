name: MediChain CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Test, & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript Type Checker
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Frontend Vitest Tests
        run: |
          cd frontend
          npm run test

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_REGISTRY_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_REGISTRY_CONTRACT_ID }}
          NEXT_PUBLIC_CORE_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_CORE_CONTRACT_ID }}
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"

      - name: Deploy to Vercel / Production (Simulation)
        run: |
          echo "🚀 MediChain Level 3 Production dApp successfully built & validated!"
          echo "Deploying Next.js frontend to production hosting target..."
