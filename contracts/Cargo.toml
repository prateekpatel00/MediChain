# ==============================================================
# MediChain — Cargo Workspace
# Manages two production-grade Soroban smart contracts:
#   - medichain-registry : Hospital whitelist / authorization
#   - medichain-core     : Medical records & access control
#                          (calls registry via cross-contract)
# ==============================================================
[workspace]
resolver = "2"
members = [
    "registry",
    "core",
]

[profile.release]
opt-level       = "z"
overflow-checks = true
debug           = false
strip           = "symbols"
debug-assertions = false
panic           = "abort"

[profile.release-with-logs]
inherits         = "release"
debug-assertions = true
