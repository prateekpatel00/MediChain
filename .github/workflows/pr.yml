name: Pull Request Verification

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  validate-pr:
    name: Lint, Typecheck & Test PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain & Wasm Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Rust Cargo Test Suite
        run: |
          cd contracts
          cargo test --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Next.js Linter
        run: |
          cd frontend
          npm run lint

      - name: TypeScript Static Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Vitest Frontend Unit Tests
        run: |
          cd frontend
          npm run test
